name: Alerta ETF

on:
  schedule:
    # From 8 a.m. till 4 p.m. UTC, every hour from Monday to Friday
    # (cobre o horário da bolsa de Xetra em hora de Portugal/Alemanha)
    - cron: "0 8-16 * * 1-5"
  workflow_dispatch:   # manual trigger

permissions:
  contents: write      # necessário para guardar o estado.json

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install yfinance

      - name: Verificar preço e avisar
        run: python aging_population.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "Atualiza estado" && git push)
